[package]
name = "corpus-fetch"
version = "0.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["full"] }
h2 = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false }
rayon = "1"
crossbeam = "0.8"
itertools = "0.13"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
bytes = "1"
mio = "1"
libc = "0.2"
rand = "0.8"
chrono = "0.4"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
indexmap = "2"
hashbrown = "0.14"
smallvec = "1"
memchr = "2"
aho-corasick = "1"
nom = "7"
winnow = "0.6"
toml = "0.8"
toml_edit = "0.22"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
parking_lot = "0.12"
num-bigint = "0.4"
num-traits = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-util = "0.7"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
petgraph = "0.6"
salsa = "0.16"
wasm-bindgen = "0.2"
bevy_ecs = "0.14"
naga = "22"
egui = "0.29"
ndarray = "0.16"
polars-core = { version = "0.43", default-features = false }
sqlparser = "0.51"
diesel = { version = "2", default-features = false, features = ["sqlite"] }
sea-query = "0.31"
tree-sitter = "0.24"
rustix = "0.38"
nix = { version = "0.29", features = ["fs"] }
zerocopy = "0.8"
bitflags = "2"
tinyvec = "1"
rustyline = "14"
ratatui = "0.28"
crossterm = "0.28"
syntect = { version = "5", default-features = false }
pulldown-cmark = "0.12"
handlebars = "6"
tera = "1"
askama = "0.12"
sqlx-core = { version = "0.8", default-features = false }
redis = { version = "0.27", default-features = false }
prost = "0.13"
tonic = { version = "0.12", default-features = false }
bincode = "1"
rmp-serde = "1"
csv = "1"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
tempfile = "3"
dirs = "5"
