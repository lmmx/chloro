name: Documentation site

# Builds the site (docs/site/, zensical.toml) and publishes it to GitHub Pages.
#
# Production (pushes to master) goes to the root of the gh-pages branch, which Pages serves
# at https://lmmx.github.io/chloro/. Each pull request from this repository gets a preview
# under gh-pages/pr-preview/pr-<number>/, linked from a comment on the pull request,
# updated on every push and removed when the pull request closes. Production deploys leave
# pr-preview/ alone, and previews touch only their own directory.
#
# While Pages is still set to deploy from GitHub Actions, master is also published that way
# (the deploy-actions job) and previews are not deployed, so the site stays up until the
# Pages source is switched to the gh-pages branch. The pages job reads which source is set.

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - ".github/workflows/site.yml"
      - "CHANGELOG.md"
      - "docs/scripts/**"
      - "docs/site/**"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZENSICAL: zensical==0.0.71
  PAGES_URL: https://lmmx.github.io/chloro/

jobs:
  # "workflow" while Pages deploys from GitHub Actions, "legacy" once it serves a branch.
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          case "${build_type}" in
            legacy | workflow) ;;
            *) build_type=unknown ;;
          esac
          echo "Pages build type: ${build_type}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Point the site at its preview path
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ env.PAGES_URL }}pr-preview/pr-${{ github.event.pull_request.number }}/
        run: sed -i "s|^site_url = .*|site_url = \"${PREVIEW_URL}\"|" zensical.toml
      - run: uv run --with "${ZENSICAL}" --no-project zensical build --clean
      - name: Check the nav and every internal link
        run: python3 docs/scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Production, on the gh-pages branch.
  deploy-branch:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Serve the files as built, without Jekyll.
      - run: touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: Deploy the documentation site from ${{ github.sha }}

  # Production while Pages still deploys from GitHub Actions; skipped once it serves gh-pages.
  deploy-actions:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.pages.outputs.build_type != 'legacy'
    needs: [pages, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v4
        id: deployment

  # Pull request previews. Only for pull requests from this repository: a fork's workflow
  # has a read-only token, and this job runs none of the pull request's code, only the
  # built files from the build job.
  preview:
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.pages.outputs.build_type == 'legacy'
      && (needs.build.result == 'success' || github.event.action == 'closed')
    needs: [pages, build]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: read
      pull-requests: write
    steps:
      # The deploy step needs a checkout to work in; the default branch, not the pull request.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"
          wait-for-pages-deployment: true
