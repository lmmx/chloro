name: Documentation site

# Builds the site (docs/site/, zensical.toml) on pull requests and deploys it to GitHub
# Pages from master. Pages must be set to deploy from GitHub Actions in the repository's
# settings for the deploy job to publish.

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - "CHANGELOG.md"
      - "docs/scripts/**"
      - "docs/site/**"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  ZENSICAL: zensical==0.0.71

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv run --with "${ZENSICAL}" --no-project zensical build --clean
      - name: Check the nav and every internal link
        run: python3 docs/scripts/check_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v4
        id: deployment
