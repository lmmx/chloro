name: CI

# Lints, tests, the minimum Rust version, the release targets and the conformance check, on
# every pull request and every push to master. The release binaries (binaries.yml) are only
# built when a release is published, so this is where a change that breaks a target, the
# minimum supported Rust version or the formatted output is caught first.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 runs the SSE2 byte search in formatter/comment.rs; the arm64 macOS runner
        # runs the portable one that every other release target uses.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  windows-arm:
    name: build (aarch64-pc-windows-msvc)
    # Cross-compiled on x86-64 Windows, as the release workflow builds it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p chloro --features cli --target aarch64-pc-windows-msvc

  msrv:
    name: minimum Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The library and the command line: the workspace's `rust-version`. The tests'
      # dependencies (smol_str) need a newer Rust, so tests are not built here.
      - run: cargo check --workspace --all-features

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every fixture identical to its stored rustfmt snapshot, at both reproduced releases,
      # and none non-idempotent (docs/site/maintainers/development.md, "Conformance")
      - name: conform at rustfmt 1.9.0 and 1.8.0
        shell: bash
        run: |
          for version in 1.9.0 1.8.0; do
            out=$(cargo run --release -q -p chloro-core --example conform -- -i -V "${version}")
            echo "${out}" | tail -n 2
            if ! grep -q '^not idempotent: 0$' <<< "${out}"; then
              echo "::error::files are not idempotent at rustfmt ${version}"
              exit 1
            fi
            if ! grep -Eq 'identical: ([0-9]+)/\1 ' <<< "${out}"; then
              echo "::error::files differ from the rustfmt ${version} snapshots"
              exit 1
            fi
          done
