name: Release Rust Binaries

permissions:
  contents: write

# Publishing the GitHub release of a `chloro-v*` tag builds the CLI for each target and
# attaches the archives to that release. `chloro-core-v*` releases have no binaries.
# The workflow can also be run by hand for an existing tag: to verify that every target
# builds (`dry-run`, nothing uploaded), or to add the archives a release run did not make.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. chloro-v0.9.0
        required: true
      dry-run:
        description: Build and archive only; upload nothing
        type: boolean
        default: true
      targets:
        description: Targets to build, space-separated (empty for all); an upload replaces existing archives
        default: ""

env:
  BINARY_NAME: chloro
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  FEATURES: cli
  RUST_BACKTRACE: 1
  # No `-D warnings` here: a release build must not fail on a lint a newer compiler adds.
  # Pull requests are built with warnings denied by ci.yml.
  RUSTUP_MAX_RETRIES: 10
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

defaults:
  run:
    shell: bash

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    # `startsWith(..., 'chloro')` would also match `chloro-core-v*`
    if: github.repository_owner == 'lmmx' && startsWith(inputs.tag || github.event.release.tag_name, 'chloro-v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # One target failing leaves the others running, and fails the run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-22.04
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04
          # - target: aarch64-unknown-linux-musl
          #   os: ubuntu-22.04
          # macos-13, the last Intel image, was retired: jobs on it waited in the queue
          # until cancelled (0.8.0, 0.9.0). Both macOS targets build on the arm64 runner;
          # x86_64 is cross-compiled there.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-2022
          # - target: x86_64-unknown-freebsd
          #   os: ubuntu-22.04
    steps:
      - name: Select target
        id: select
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [[ -z "${TARGETS}" || " ${TARGETS} " == *" ${{ matrix.target }} "* ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "${{ matrix.target }} is not in '${TARGETS}'; skipped"
          fi

      - name: Checkout repository
        if: steps.select.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install Rust toolchain
        if: steps.select.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
        if: steps.select.outputs.build == 'true' && startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')

      - uses: taiki-e/install-action@v2
        with:
          tool: cross
        if: steps.select.outputs.build == 'true' && contains(matrix.target, '-musl')

      - run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
        if: steps.select.outputs.build == 'true' && endsWith(matrix.target, 'windows-msvc')

      # Profile-guided build (benchmarks/pgo.sh): where the runner executes the target
      # natively, train an instrumented build on the conformance fixtures and point
      # RUSTFLAGS at the merged profile, so the upload action's own `cargo build` below
      # uses it. Cross-compiled targets, and any target whose training fails, keep the
      # plain build. The profile is tied to this toolchain and source, so it is made on
      # every run rather than cached.
      - name: Train PGO profile
        if: steps.select.outputs.build == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [[ "${host}" != "${TARGET}" ]]; then
            echo "PGO skipped: ${TARGET} is cross-compiled on ${host}; plain build"
            exit 0
          fi
          profile="${PWD}/target/pgo-gen/profiles/merged.profdata"
          if rustup component add llvm-tools-preview \
            && benchmarks/pgo.sh --phase train --target "${TARGET}" target "${FEATURES}" \
            && [[ -s "${profile}" ]]; then
            if type -P cygpath >/dev/null; then profile=$(cygpath -m "${profile}"); fi
            echo "RUSTFLAGS=${RUSTFLAGS} -Cprofile-use=${profile} -Cllvm-args=-pgo-warn-missing-function" >> "${GITHUB_ENV}"
          else
            echo "::warning::PGO training failed for ${TARGET}; the release binary is the plain build"
          fi

      - name: Extract version from tag
        if: steps.select.outputs.build == 'true'
        id: version
        run: echo "VERSION=${TAG#chloro-}" >> "${GITHUB_OUTPUT}"

      - uses: taiki-e/upload-rust-binary-action@v1
        if: steps.select.outputs.build == 'true'
        with:
          bin: ${{ env.BINARY_NAME }}
          archive: ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ steps.version.outputs.VERSION }}
          target: ${{ matrix.target }}
          features: ${{ env.FEATURES }}
          tar: all
          zip: windows
          ref: refs/tags/${{ env.TAG }}
          dry-run: ${{ inputs.dry-run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
