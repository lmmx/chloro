name: Release Rust Binaries

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  BINARY_NAME: chloro
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  FEATURES: cli
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    if: github.repository_owner == 'lmmx'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-22.04
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04
          # - target: aarch64-unknown-linux-musl
          #   os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-13
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-2022
          # - target: x86_64-unknown-freebsd
          #   os: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')

      - uses: taiki-e/install-action@v2
        with:
          tool: cross
        if: contains(matrix.target, '-musl')

      - run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
        if: endsWith(matrix.target, 'windows-msvc')

      # Profile-guided build (benchmarks/pgo.sh): where the runner executes the target
      # natively, train an instrumented build on the conformance fixtures and point
      # RUSTFLAGS at the merged profile, so the upload action's own `cargo build` below
      # uses it. Cross-compiled targets, and any target whose training fails, keep the
      # plain build. The profile is tied to this toolchain and source, so it is made on
      # every run rather than cached.
      - name: Train PGO profile
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, env.BINARY_NAME)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [[ "${host}" != "${TARGET}" ]]; then
            echo "PGO skipped: ${TARGET} is cross-compiled on ${host}; plain build"
            exit 0
          fi
          profile="${PWD}/target/pgo-gen/profiles/merged.profdata"
          if rustup component add llvm-tools-preview \
            && benchmarks/pgo.sh --phase train --target "${TARGET}" target "${FEATURES}" \
            && [[ -s "${profile}" ]]; then
            if type -P cygpath >/dev/null; then profile=$(cygpath -m "${profile}"); fi
            echo "RUSTFLAGS=${RUSTFLAGS} -Cprofile-use=${profile} -Cllvm-args=-pgo-warn-missing-function" >> "${GITHUB_ENV}"
          else
            echo "::warning::PGO training failed for ${TARGET}; the release binary is the plain build"
          fi

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#chloro-}" >> $GITHUB_OUTPUT

      - uses: taiki-e/upload-rust-binary-action@v1
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, env.BINARY_NAME)
        with:
          bin: ${{ env.BINARY_NAME }}
          archive: ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ steps.version.outputs.VERSION }}
          target: ${{ matrix.target }}
          features: ${{ env.FEATURES }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
